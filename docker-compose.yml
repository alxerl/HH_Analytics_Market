services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hh_market
      POSTGRES_USER: hh_market
      POSTGRES_PASSWORD: hh_market
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hh_market -d hh_market"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
