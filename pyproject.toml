[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hh-analytics-market"
version = "0.1.0"
description = "Reproducible HeadHunter analytics market pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "pydantic-settings>=2.2,<3",
  "PyYAML>=6.0,<7",
  "tenacity>=8.3,<10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "pre-commit>=4.0,<5",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
hh-market = "hh_market.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/hh_market"]
